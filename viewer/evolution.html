        <button class="language" id="lang" type="button">EN</button>

    <main class="sheet">
      <header class="sheet-head">
        <h1 data-en="Airframe evolution">机体四阶对照</h1>

      </div>
      <p id="status" role="status" data-en="Loading flight models…">正在载入战机模型…</p>
      <footer>
        <p data-en="Top view at a shared scale. Select a ship to inspect its loadout.">同尺度正俯视。点选机体可检查装配。</p>
        <p data-en="All ships carry base W01. Vesper also shows a W07 bay and its two deployed light drones.">四机均安装基础 W01。暮萤另配 W07 母港，展示两架已部署的轻型无人机。</p>
      </footer>
